name: Build Signed Android APK & Play Store AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'وسم الإصدار على GitHub Releases (مثلاً app-latest أو v1.0.0)'
        required: true
        default: 'app-latest'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Dependencies & Build Production Mobile Bundle
        env:
          VITE_API_BASE_URL: https://essa-pages-proxy.vercel.app
          VITE_TELEGRAM_CHANNEL_URL: https://t.me/IssaAllaith
        run: |
          if [ -f "111.jpg" ]; then
            mkdir -p apps/mobile/public
            cp "111.jpg" apps/mobile/public/app-icon.jpg
            rm -f apps/mobile/android/app/src/main/res/drawable/ic_app_icon.xml
            cp "111.jpg" apps/mobile/android/app/src/main/res/drawable/ic_app_icon.jpg
          fi
          npm install --no-audit --no-fund
          npm run build

      - name: Embed Built App into Android Assets
        run: |
          rm -rf apps/mobile/android/app/src/main/assets/www
          mkdir -p apps/mobile/android/app/src/main/assets/www
          cp -r apps/mobile/dist/* apps/mobile/android/app/src/main/assets/www/
          ls -lh apps/mobile/android/app/src/main/assets/www/

      - name: Decode Release Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing! Run scripts/setup-android-signing.ps1 first."
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > apps/mobile/android/keystore/essa-release.keystore
          ls -lh apps/mobile/android/keystore/essa-release.keystore

      - name: Build Signed Release APK & AAB (Android 7.0 – Android 15+)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: keystore/essa-release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Signed APK Signature
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK_PATH"
          test -f "$AAB_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Verifying APK with: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          cp "$APK_PATH" issa-allaith-signed-release.apk
          cp "$AAB_PATH" issa-allaith-signed-release.aab
          ls -lh issa-allaith-signed-release.apk issa-allaith-signed-release.aab

      - name: Upload Signed APK & AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issa-allaith-android-signed-release
          path: |
            issa-allaith-signed-release.apk
            issa-allaith-signed-release.aab
          retention-days: 30

      - name: Publish Signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          TAG="${TAG_NAME:-app-latest}"
          if [ "$TAG" = "main" ]; then TAG="app-latest"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" issa-allaith-signed-release.apk issa-allaith-signed-release.aab --clobber
          else
            gh release create "$TAG" issa-allaith-signed-release.apk issa-allaith-signed-release.aab \
              --title "مكتبة عيسى الليث — Android Signed Release ($TAG)" \
              --notes "تطبيق مكتبة عيسى الليث الموقّع رسمياً للأندرويد (يدعم Android 7.0 حتى Android 15+) — ملف APK للتثبيت المباشر وملف AAB للنشر على متجر Google Play."
          fi
