<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0C10" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101520'/%3E%3Crect x='14' y='26' width='6' height='14' rx='3' fill='%23E2A84B'/%3E%3Crect x='24' y='18' width='6' height='30' rx='3' fill='%23E2A84B'/%3E%3Crect x='34' y='12' width='6' height='40' rx='3' fill='%23F3C677'/%3E%3Crect x='44' y='22' width='6' height='22' rx='3' fill='%232EC492'/%3E%3C/svg%3E"
    />
    <title>مكتبة عيسى الليث | صوتيات وكلمات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #06080c;
        color: #f4f6fa;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      /* شريط تمرير ناعم وخفي يناسب تجربة التطبيقات الأصلية */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(226, 168, 75, 0.25);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(226, 168, 75, 0.45);
      }

      input, textarea {
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        outline: none;
      }

      @keyframes eqBarBounce {
        0%, 100% { transform: scaleY(0.32); }
        50% { transform: scaleY(1); }
      }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
