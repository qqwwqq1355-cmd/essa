name: Automated Telegram Sync (@IssaAllaith -> Cloudflare R2 + D1)

on:
  schedule:
    # يفحص قناة عيسى الليث تلقائياً كل 15 دقيقة (أكثر ثباتاً على GitHub Actions)
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع المزامنة (backfill لنقل وتحسين كل الزوامل إلى Cloudflare R2، incremental للجديد فقط)'
        required: true
        default: 'backfill'
        type: choice
        options:
          - backfill
          - incremental

concurrency:
  group: telegram-sync-issa-allaith
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure FFmpeg (Fast-Start 96k Audio Optimization)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Sync Dependencies
        working-directory: services/telegram-sync
        run: npm install --no-audit --no-fund

      - name: Sync & Upload @IssaAllaith MP3 directly to Cloudflare R2 + D1
        working-directory: services/telegram-sync
        env:
          SOURCE_CHANNEL_USERNAME: IssaAllaith
          STORAGE_MODE: r2
          EDGE_API_URL: https://essa-alleth-edge-api.qqwwqq1355.workers.dev
          AUDIO_BITRATE: 96k
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          R2_UPLOAD_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'incremental' }}
        run: npm run sync
